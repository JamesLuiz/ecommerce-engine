name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: infra/docker/backend.Dockerfile
          - name: storefront
            dockerfile: infra/docker/storefront.Dockerfile
          - name: dashboard
            dockerfile: infra/docker/dashboard.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  notify:
    name: register release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: POST release to dashboard
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$DASHBOARD_URL" ]; then
            echo "DASHBOARD_URL is not configured; skipping release notification."
            exit 0
          fi

          curl --fail-with-body -sS -X POST "$DASHBOARD_URL/api/internal/releases" \
            -H "Authorization: Bearer $RELEASE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"version\":\"$VERSION\"}"
