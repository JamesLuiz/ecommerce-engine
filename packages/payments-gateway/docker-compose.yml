name: flowcheq-payments-gateway

# Local development compose file. All configuration comes from .env next to
# this file; this file declares no environment variables of its own.
#
#   docker compose up -d
#
# Do NOT deploy the gateway on Coolify through this file: Coolify sets the
# compose project directory to the repository root, which breaks the relative
# build context here. On Coolify, create Dockerfile applications with
# infra/docker/gateway.Dockerfile instead (see the README "Deploy on Coolify").

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    command: ["dist/migrate.js"]
    env_file: .env
    restart: "no"

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    command: ["dist/worker.js"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
