services:
  gateway:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [pg, redis]
    restart: unless-stopped
  worker:
    build: .
    command: node dist/worker.js
    env_file: .env
    depends_on: [pg, redis]
    restart: unless-stopped
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gateway_dev_password}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
volumes: { pgdata: {} }
