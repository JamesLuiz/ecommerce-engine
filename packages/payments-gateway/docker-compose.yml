name: flowcheq-payments-gateway

# All configuration comes from .env next to this file; this file declares no
# environment variables of its own. Point DATABASE_URL and REDIS_URL in .env
# at the Postgres and Redis the platform runs on (Coolify-managed or other):
#
#   docker compose up -d

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    command: ["dist/migrate.js"]
    env_file: .env
    restart: "no"

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    image: flowcheq/payments-gateway:local
    command: ["dist/worker.js"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
